<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg3)" />

  <!-- Header Text -->
  <text x="640" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">
    Custom Instructions &amp; Multi-Model AI
  </text>
  <text x="640" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Configure API keys, preferred models, and customized prompts for each domain
  </text>

  <!-- Settings App Window Mockup -->
  <g transform="translate(180, 140)" filter="url(#shadow3)">
    <rect width="920" height="610" rx="12" fill="#ffffff" />
    
    <!-- Titlebar -->
    <rect width="920" height="44" rx="12" fill="#f8fafc" />
    <circle cx="24" cy="22" r="6" fill="#ef4444" />
    <circle cx="44" cy="22" r="6" fill="#f59e0b" />
    <circle cx="64" cy="22" r="6" fill="#10b981" />
    <text x="100" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569">
      AI Translator — Settings
    </text>

    <!-- Settings Content -->
    <g transform="translate(40, 65)">
      <!-- Provider Selection Box -->
      <g>
        <text x="0" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">AI PROVIDER</text>
        <rect x="0" y="28" width="400" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
        <text x="16" y="52" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Google Gemini (or OpenCode Zen)</text>
      </g>

      <!-- Target Language -->
      <g transform="translate(440, 0)">
        <text x="0" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">TARGET LANGUAGE</text>
        <rect x="0" y="28" width="400" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
        <text x="16" y="52" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Spanish, French, Japanese, German...</text>
      </g>

      <!-- Domain Custom Instructions Card -->
      <g transform="translate(0, 85)">
        <rect width="840" height="210" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
        
        <!-- Domain Header -->
        <text x="20" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">
          🌐 docs.technology.org
        </text>
        <text x="240" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">
          • 2 saved sections
        </text>

        <text x="20" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">
          Custom instructions for this domain:
        </text>
        
        <!-- Prompt Box -->
        <rect x="20" y="76" width="670" height="70" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />
        <text x="32" y="102" font-family="system-ui, sans-serif" font-size="13" fill="#1e293b">
          "Use a formal academic tone. Keep technical acronyms (e.g. API, LLM, CLI) in English."
        </text>
        <text x="32" y="126" font-family="system-ui, sans-serif" font-size="13" fill="#1e293b">
          "Preserve markdown table structure without modification."
        </text>

        <!-- Save Button -->
        <rect x="704" y="76" width="116" height="40" rx="6" fill="#1a73e8" />
        <text x="762" y="101" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">
          ✓ Save Prompt
        </text>

        <text x="20" y="175" font-family="monospace" font-size="11" fill="#64748b">
          Selectors: section.summary, article.research-body
        </text>
      </g>

      <!-- Bottom Actions & Ko-fi Card -->
      <g transform="translate(0, 315)">
        <rect width="840" height="90" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
        
        <text x="20" y="35" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">
          Support Open Source Development
        </text>
        <text x="20" y="60" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">
          Free and open-source extension. Bring your own free or paid API keys.
        </text>

        <g transform="translate(630, 24)">
          <rect width="190" height="42" rx="6" fill="#ff5e5b" />
          <text x="95" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
            ☕ Buy me a coffee
          </text>
        </g>
      </g>
    </g>
  </g>
</svg>
